    </text>
    <text x="784" y="348" fill="#E2E8F0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21">
        basedIn: <tspan fill="#F9A8D4">"Kathmandu"</tspan>
    </text>
    <text x="758" y="382" fill="#7DD3FC" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21">
      };
    </text>
