    </text>
    <text x="0" y="128" fill="#C7D2DA" font-family="'Avenir Next', 'Trebuchet MS', 'Segoe UI', sans-serif" font-size="28" font-weight="600">
      Full Stack Developer | ML and MLOps Engineer
    </text>
    <text x="0" y="182" fill="#D5E3EA" font-family="'Avenir Next', 'Trebuchet MS', 'Segoe UI', sans-serif" font-size="24" font-weight="500">
      Building polished web products, backend systems, and
    </text>
    <text x="0" y="218" fill="#D5E3EA" font-family="'Avenir Next', 'Trebuchet MS', 'Segoe UI', sans-serif" font-size="24" font-weight="500">
      production-ready ML platforms from Kathmandu, Nepal.
    </text>

    <g transform="translate(0 266)">
      <rect x="0" y="0" width="170" height="42" rx="21" fill="url(#chip)" stroke="#26475A" />
      <text x="28" y="27" fill="#E2E8F0" font-family="'Avenir Next', 'Trebuchet MS', 'Segoe UI', sans-serif" font-size="18" font-weight="600">
        React + Next.js
      </text>

      <rect x="188" y="0" width="184" height="42" rx="21" fill="url(#chip)" stroke="#26475A" />
      <text x="214" y="27" fill="#E2E8F0" font-family="'Avenir Next', 'Trebuchet MS', 'Segoe UI', sans-serif" font-size="18" font-weight="600">
        Python + FastAPI
      </text>

      <rect x="390" y="0" width="236" height="42" rx="21" fill="url(#chip)" stroke="#26475A" />
      <text x="416" y="27" fill="#E2E8F0" font-family="'Avenir Next', 'Trebuchet MS', 'Segoe UI', sans-serif" font-size="17" font-weight="600">
        Docker + Kubernetes
      </text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="722" y="113" width="468" height="294" rx="28" fill="url(#panel)" stroke="#244051" />
    <rect x="722" y="113" width="468" height="54" rx="28" fill="#10202D" />
    <circle cx="758" cy="140" r="7" fill="#FB7185" />
    <circle cx="785" cy="140" r="7" fill="#FBBF24" />
    <circle cx="812" cy="140" r="7" fill="#34D399" />

    <text x="758" y="204" fill="#7DD3FC" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21">
      const profile = {
    </text>
    <text x="784" y="240" fill="#E2E8F0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21">
        role: <tspan fill="#FDE68A">"Full Stack"</tspan>,
    </text>
    <text x="784" y="276" fill="#E2E8F0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21">
        focus: <tspan fill="#5EEAD4">["ML", "MLOps"]</tspan>,
    </text>
    <text x="784" y="312" fill="#E2E8F0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21">
